filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /var/log/syslog
    - /var/log/auth.log
    - /home/*/app.log
  
  # TODO: Add fields to tag logs
  # fields:
  #   log_type: system
  #   environment: lab

  # TODO: Configure multiline settings for stack traces
  # multiline.pattern: '^[[:space:]]'
  # multiline.negate: false
  # multiline.match: after

output.logstash:
  hosts: ["localhost:5044"]

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
